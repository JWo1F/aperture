name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App (analyze, test, build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Ad-hoc signed and not notarized: Gatekeeper blocks it on first open
      # until the user allows it (see README). Developer ID signing and
      # notarization need an Apple Developer account and are not set up.
      - name: Build the DMG
        run: tool/make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aperture-macos
          path: dist/*.dmg
          if-no-files-found: error

  website:
    name: Website (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: website
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, website]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The DMG is named after pubspec.yaml's version; a tag that disagrees
      # would publish a release whose title and file contradict each other.
      - name: Check the tag matches pubspec.yaml
        run: |
          version="$(sed -n 's/^version: *\([0-9][^+]*\).*/\1/p' pubspec.yaml)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${version}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: aperture-macos
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.dmg --title "Aperture ${GITHUB_REF_NAME#v}" --generate-notes
