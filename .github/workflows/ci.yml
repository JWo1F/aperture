name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App (analyze, test, build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # A tag is a release, and a release is always Developer ID signed and
      # notarized: without the secrets this step fails rather than publish a
      # build Gatekeeper would block. Other pushes build ad-hoc, which needs
      # no secrets — pull requests from forks never see them.
      - name: Import the signing certificate and notary key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || { echo "secret $name is not set" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          # The runner trusts Apple's roots but not the Developer ID
          # intermediates, so without them the identity has no chain and
          # find-identity -v leaves it out. Both generations: a certificate
          # may come from either.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain"
          done
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "no valid Developer ID Application identity; what the keychain holds:" >&2
            security find-identity -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "DEVELOPER_ID=$identity" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build the DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: tool/make_dmg.sh

      # Installed copies update through Sparkle, which accepts a DMG only
      # with an EdDSA signature from the key whose public half is in
      # Info.plist. Only a tag publishes, so only a tag signs.
      - name: Sign the update and write the appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: tool/make_appcast.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aperture-macos
          path: |
            dist/*.dmg
            dist/appcast.xml
          if-no-files-found: error

  website:
    name: Website (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: website
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, website]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The DMG is named after pubspec.yaml's version; a tag that disagrees
      # would publish a release whose title and file contradict each other.
      - name: Check the tag matches pubspec.yaml
        run: |
          version="$(sed -n 's/^version: *\([0-9][^+]*\).*/\1/p' pubspec.yaml)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${version}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: aperture-macos
          path: dist
      # Attached under one fixed name, so releases/latest/download/Aperture.dmg
      # always downloads the newest build; the appcast points at the same
      # name under this tag's path.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/Aperture-*.dmg dist/Aperture.dmg
          gh release create "${GITHUB_REF_NAME}" dist/Aperture.dmg dist/appcast.xml --title "Aperture ${GITHUB_REF_NAME#v}" --generate-notes
